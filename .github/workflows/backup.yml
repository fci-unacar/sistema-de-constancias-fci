name: Respaldo de base de datos

# Domingos a las 06:00 UTC (00:00 en Campeche, UTC-6), más ejecución manual
# desde la pestaña Actions.
on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  respaldo:
    name: pg_dump de Supabase
    runs-on: ubuntu-latest
    steps:
      # Se instala el cliente desde el repositorio oficial de PostgreSQL para
      # que la versión de pg_dump no quede por debajo de la del servidor de
      # Supabase (pg_dump se niega a volcar una base más nueva que él).
      - name: Instalar cliente de PostgreSQL
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            --fail https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      # El repositorio es público y en un repositorio público cualquier
      # usuario de GitHub puede descargar los artifacts. Por eso el respaldo
      # (que trae datos de alumnos) se cifra con AES-256 antes de subirlo;
      # sin la frase de RESPALDO_PASSPHRASE el archivo no sirve de nada.
      #
      # Para restaurar:
      #   gpg --decrypt constancias-fci-AAAA-MM-DD.sql.gpg > respaldo.sql
      - name: Generar respaldo cifrado
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          RESPALDO_PASSPHRASE: ${{ secrets.RESPALDO_PASSPHRASE }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ] || [ -z "$RESPALDO_PASSPHRASE" ]; then
            echo "Faltan los secrets SUPABASE_DB_URL y/o RESPALDO_PASSPHRASE (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          set -o pipefail
          mkdir -p respaldo
          FECHA=$(date -u +%Y-%m-%d)
          echo "FECHA=$FECHA" >> "$GITHUB_ENV"
          # El SQL en claro nunca toca el disco: va directo de pg_dump a gpg.
          pg_dump "$SUPABASE_DB_URL" --no-owner --no-privileges \
            | gpg --batch --yes --pinentry-mode loopback --symmetric --cipher-algo AES256 \
                  --passphrase-fd 3 3<<<"$RESPALDO_PASSPHRASE" \
                  --output "respaldo/constancias-fci-$FECHA.sql.gpg"
          ls -l respaldo/

      - name: Subir respaldo como artifact
        uses: actions/upload-artifact@v4
        with:
          name: respaldo-constancias-fci-${{ env.FECHA }}
          path: respaldo/
          retention-days: 30
